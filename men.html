<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>소개팅 카드 · 남자</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70; --line: #e6e4df;
  --accent: #2f6fdb; --soft: #e8f0fd;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --card: #1f1f22; --text: #f1f1f3; --sub: #a1a1a8; --line: #2e2e33;
          --accent: #7aa8ff; --soft: #1c2a44; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }

/* 잠금 화면 */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lockbox { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 28px 22px; text-align: center; }
.lockbox h1 { font-size: 19px; margin: 0 0 6px; }
.lockbox p { font-size: 14px; color: var(--sub); margin: 0 0 18px; }
.lockbox input { width: 100%; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg); color: var(--text); }
.lockbox input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.lockbox button { width: 100%; margin-top: 10px; font-size: 16px; font-weight: 600; padding: 12px;
  border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
.lockbox button:disabled { opacity: .6; cursor: default; }
.err { color: #d33; font-size: 13px; min-height: 20px; margin-top: 8px; }

/* 목록 */
header h1 { font-size: 22px; margin: 0 0 4px; }
header h1 span { color: var(--accent); }
header p { margin: 0 0 20px; color: var(--sub); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent);
  border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.card .one { margin: 0; font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--text); }
.tag.strong { background: var(--accent); color: #fff; font-weight: 600; }
dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 5px 10px; font-size: 14px; }
dt { color: var(--sub); }
dd { margin: 0; }
.want { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.want h3 { margin: 0; font-size: 13px; color: var(--sub); font-weight: 600; }
.want dl { grid-template-columns: 72px 1fr; }
.want dt { color: var(--text); font-weight: 600; }
.want dd span { color: var(--sub); margin-right: 6px; }
.empty { color: var(--sub); }
footer { margin-top: 28px; padding: 16px; border-radius: 12px; background: var(--card);
  border: 1px solid var(--line); font-size: 14px; color: var(--sub); }
footer b { color: var(--text); }
</style>
</head>
<body>
<div id="lock">
  <form class="lockbox" id="f">
    <h1>소개팅 카드 · 남자</h1>
    <p>비밀번호를 넣어 주세요</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="비밀번호" autofocus>
    <button id="go" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div class="wrap" id="app" hidden></div>

<script>
const PAYLOAD = {"salt": "WeRY4CYyiw3S/gjc15r/xA==", "iv": "NI8UFfTvq86E2P1j", "ct": "l5qe6MxWoEzz6ajtn8cwdVH2V0zok3GSGgmBLwiRUUo0q8CvETD4Wb8BryOPkCP4YHh9zrDcJMENbxDB3E1CTgi0JCSyDeuO8kO8/Fb2TteBk3pCC24fzUXtAO/wNfZhyKuaNvFUBs6e48V3MU6caRsScX5S9rYaEzo7mZ7l7zcdu5xztxWDtWs2OtmkyQqMLw/fAYSJguYFpUITk/yiF9aekj+xJ4jG0XTEFIhj7ClF//c1TSM9D3IgmKhAB9JLP6A3If47M25Oo5jV9JywCw/QDp/L3MLqcpVgFVl0MNGCIN2/a6WTdsda2YpQAeybSiSqRuFwo/fEck/tezhwKN6hWJK0/6XDC61arEbXpBwJ+0+tLAzkke5yHOoj/zt8wkkbGcuqvj+iH8HqfznDLGw7xrNv+KQ5Q6CO2YlO0GBLdZ+XU2rnQ0AvZXcahHHbm2R6c0RJPVSii6SU9eUgRbmwCnBKOox8QqvfzVmaEonFJSfCcAf8zByXkh79b3Auy+v7WhTuRnmw4EeMpfsVFH6AyJLSoOigOS5vWEDDKCqeNzyL+VvFr/heTz0sEzP7b1rAmvwgLGfDgqIag+r8DkyZpEJI7fIzqZad46jfpkTffSBrf9NVXGyYEY88X+YaAgXndouhYmMt4ml6wBexqFvPjFg7DIsN/8CKLRYOL34mAvh2hebxrgUSSWf2wRJ1mH9lJjwWV44snC3X+cFcNYC2dv2AxxOAeUu1YeZKyc+uR8DEhvnw3eHVhEbottiQdNescqnuJJfRX7KRJeM4T5B+6ScyPZDv3cXFQvlepjAW2Q3eUVXgahdg6O+oDIR/JYLZw9jYysHzJefAWzBc5FuwUqwegD0bpdRPsgrEWY8n5f5phiE6g/fI3j0HkNBOaBiZM0Y/FUsLm138mNfqGf5qaRKqge1c9CYOHVTSnzGm8hO1pKch5CMiUiGWjdOrxHJSDQM15B9J0hRFVdvoCstrJHfo9X7myA6Y5VDQIlNmjYpN51RridJqLDG058OWHq9/fk9j1V7wlLVM9cZXtWNwqES8ou7kqQzNG7VjdxAB1LpawQ6BCeaGANVesep5smw99O6KhRL4RrHpzi+9XMnioAefcjwA0I/KWBLtWrxo1m5tZBhT3udGyVKmojArR64uGY1u29dlIpYSllX/EvXTQQGeZgFztoHE9tXZ362NVi4zXN4dbY2hN4MLdWuQJe7cKmjgbS+UJJnrQv63Z8ahX5o6Pg4a9EMQwp9x5RTgXs0bOaj46Q2aLhcyQkypFIHfXjhmKRUMJZAHFYaHWJgYRSNmSgNfXTksUMxkX+QlNFtomxhCJ1RV/BNW8QyfkXEXk1wA77PUFLtkso9WUl7nJJXA/n+PXV9+8P90SfC32BJYmsYKNlWXc9NvJpiAYUJfdHIklA02wjCvDfC3fm1qaFOjd9XvmF8y29tofK/oybGTJ9IrAKB5xltTUbwpnWfcSn9zKEFIrrJXQJVlYyPEiuVWQUw41tKtp9h4lxQwD2+BM5eryja1FqZfBp/3H6FrxjWaPwfIRzbgZlsvZjqUgfnKl4+kC6s/DQRIx57J6ZEFJYmZbe14Va4UwlCNqdJsvk220VVnF+Uwh225YMzUXsuLCzMxRU50Poko32tZGLRaiDUPYRAcjYGMcNGeJ5v31nRcYlx/g8+xJ45vZ8cZw1dVlYEiZN3RL6VcFEVnSk27TzlCM6xUD5RaA2OGSzVJ6rkrK4xvyaW8gzX/kFrcTzJxtpmuD+TPGMhKo+9f21krT9Vgs4b52/rJEnmkkwbr8boJG6wrewq/oPCA+BmW5feiJ81k1PQyKyVJFx342A92EuqHIhdK/WlYAGlpT6qVwUioP5fkvKsk0yaYf2EaPF7It/cSb0tCLIl66tnT/RI1ShgQPQyD5UDAqcebf4d96m76TDDqngxGIyZxCa8QnpccbUc85kniiT4u4b6TKHkSRZu3IeZUAcQyakrimFpIsvFl3+vfNj4ciBTs6Zf6uEW0OK8SYJT8Qub9S/+CVpThV4o8Wtps9J8dA3S2tWcsbKRPNBFPMAr5v9jENZVCBdJ/E4zjFp8vU+U75/qNHbWi3ACsJUQr", "iter": 310000};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const pref = (label, o = {}) => {
  const rows = ["외모", "성격", "생활"].filter(k => o[k] && o[k].length)
    .map(k => `<div><span>${k}</span>${o[k].map(esc).join(", ")}</div>`).join("");
  return rows ? `<dt>${label}</dt><dd>${rows}</dd>` : "";
};
const tag = (pre, v) => v ? `<span class="tag">${esc(pre)}${esc(v)}</span>` : "";
const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
const list = a => (a && a.length) ? a.map(esc).join(", ") : '<span class="empty">-</span>';

function render(cards) {
  const html = cards.map(c => `
    <article class="card">
      <h2>${esc(c.제목)}</h2>
      ${c.성격 ? `<p class="one">${esc(c.성격)}</p>` : ""}
      <div class="tags">
        ${c.원하는만남 ? `<span class="tag strong">${esc(c.원하는만남)}</span>` : ""}
        ${tag("", c.MBTI)}${tag("종교 ", c.종교)}${tag("흡연 ", c.흡연)}${tag("음주 ", c.음주)}
      </div>
      <dl>
        ${row("사는 곳", c.사는곳)}${row("직업", c.직업)}${row("직장", c.직장위치)}${row("취미", c.취미)}
      </dl>
      <div class="want">
        <h3>원하는 상대</h3>
        <dl>
          ${c.상대나이 && c.상대나이.length ? `<dt>나이</dt><dd>${list(c.상대나이)}</dd>` : ""}
          ${pref("좋아요", c.좋아요)}
          ${pref("안 맞아요", c.안맞아요)}
        </dl>
      </div>
    </article>`).join("");
  document.getElementById("app").innerHTML = `
    <header>
      <h1>소개팅 카드 · 남자 <span>${cards.length}명</span></h1>
      <p>사진 없이 정보만 보여 드려요.</p>
    </header>
    <section class="grid">${html}</section>
    <footer>마음에 드는 카드가 있으면 주선자에게 <b>카드 제목</b>(예: ${esc(cards[0]?.제목 || "93년생 · 178cm")})으로 알려 주세요.
      양쪽 모두 좋다고 하면 사진과 연락처를 전해 드려요.</footer>`;
  document.getElementById("lock").remove();
  document.getElementById("app").hidden = false;
}

async function open(pw, remember) {
  const cards = await decrypt(pw);
  if (remember) { try { sessionStorage.setItem("pw", pw); } catch (e) {} }
  render(cards);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "여는 중…"; err.textContent = "";
  try { await open(document.getElementById("pw").value, true); }
  catch (x) { err.textContent = "비밀번호가 맞지 않아요"; btn.disabled = false; btn.textContent = "열기"; }
});

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem("pw"); } catch (e) {}
  if (saved) { try { await open(saved, false); } catch (e) {} }
})();
</script>
</body>
</html>
