<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>소개팅 카드 · 남자</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70; --line: #e6e4df;
  --accent: #2f6fdb; --soft: #e8f0fd;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --card: #1f1f22; --text: #f1f1f3; --sub: #a1a1a8; --line: #2e2e33;
          --accent: #7aa8ff; --soft: #1c2a44; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }

/* 잠금 화면 */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lockbox { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 28px 22px; text-align: center; }
.lockbox h1 { font-size: 19px; margin: 0 0 6px; }
.lockbox p { font-size: 14px; color: var(--sub); margin: 0 0 18px; }
.lockbox input { width: 100%; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg); color: var(--text); }
.lockbox input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.lockbox button { width: 100%; margin-top: 10px; font-size: 16px; font-weight: 600; padding: 12px;
  border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
.lockbox button:disabled { opacity: .6; cursor: default; }
.err { color: #d33; font-size: 13px; min-height: 20px; margin-top: 8px; }

/* 목록 */
header h1 { font-size: 22px; margin: 0 0 4px; }
header h1 span { color: var(--accent); }
header p { margin: 0 0 20px; color: var(--sub); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent);
  border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.card .one { margin: 0; font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--text); }
.tag.strong { background: var(--accent); color: #fff; font-weight: 600; }
dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 5px 10px; font-size: 14px; }
dt { color: var(--sub); }
dd { margin: 0; }
.want { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.want h3 { margin: 0; font-size: 13px; color: var(--sub); font-weight: 600; }
.want dl { grid-template-columns: 72px 1fr; }
.want dt { color: var(--text); font-weight: 600; }
.want dd span { color: var(--sub); margin-right: 6px; }
.empty { color: var(--sub); }
footer { margin-top: 28px; padding: 16px; border-radius: 12px; background: var(--card);
  border: 1px solid var(--line); font-size: 14px; color: var(--sub); }
footer b { color: var(--text); }
</style>
</head>
<body>
<div id="lock">
  <form class="lockbox" id="f">
    <h1>소개팅 카드 · 남자</h1>
    <p>비밀번호를 넣어 주세요</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="비밀번호" autofocus>
    <button id="go" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div class="wrap" id="app" hidden></div>

<script>
const PAYLOAD = {"salt": "ReShRSglB8zI069y8m6HXQ==", "iv": "kvt8muQhKc9arJ6V", "ct": "QStAuHRD2vtLjiusNUdH+jMP9IBnoJVvPiKMQ2RwM2k098YWWD9AQnXmTBzDqg0M22Y9ZS1wgH/ZfQm7ud+19h22g5Jy6XrcCGkpstvEaS/KgaEsnVVxdAh6CDIXwR26VokuQNJuYeZ5lSqmU1bcaJgpg3C6HNdRoq4Qrenq0UbrNokLXWUrJezMfByqNsEPNAvUJuDuTBiJZegeHt9vXHtK8TJFxGTXPKx+wTcAYiS+A2SLgNKJGi8AtMYKzUTiWMqmXduhuzyKPfpAnwcmWjNpN/IFRPCNgIhuG0u5KMwTMAHfiV4vfp1nMHXqIB1SgLRI9C5fX8AQ47cUlWxmKsoZYOj8RbIzXDiZG6zvVy/eu0+12nKYa9mySmXuczWQ6o6+96588qTa0fVrAHCW+i5xjKLgREwlNl6jit0NPZlsI08VUKa4NUkNSHSVC57AcnPv+7XpIKKJWXWPZN+G/FfyhkH9Ikm1/heIPaOQIcTBFKE8AEmR80pztYfVCKCOkv1nAofAmDbxEGH2JVkSbuRK8HFZ/Wpt+LOt46S6aUdbho+9IxiSThdOQGKeRsmDtVF2Rcm9/laTgURHWsa2ql8EkhTM0x3eE1IUonPpUnEA/blmKOxydDE/ai1ezt3LSWQ279+3Dv8/vJl96pj9jR819VjVeCMwWgdEaj+KLytaPrMkH385ih+jAM9nF+lXGROULRvSZi0OQkY7nz8ZRMjLHY+xha4/M12Y7RKKzSqDzBv6ymOMJ/Eor5PdIwimX1aJGSJxm/b8j4ZDpChQef6CC1Fp2o0nrEP83jns26b1vpVW7lIwH6IGM90wE8GRyM6yDeAkHpDPfOLSI0pZTz3fB1QNyBktt1KpogXBudj4UOrwZ144iCzziypsxEzICgGuev1mOh3KPZFBDf3JnQ0t9YdfTIqMi4gSkC1t+IOkKnN0sGbd9DYJYCulTO3sYHRvlQfXcqF8XJoWeRDP+tpiXPNBEOZe4JM54/YjOdpc5EE6Hts3+/8CuCTbN/ApaDGzrwfK41OJxPqLCiAR9+4oCDG7SG7L/JhqdmCg8ImrZD5ZMrgjpwazcgVYyZFOZilW5oVgrnJlwJReWgC9bYMYtdQrqhDk5KdZPENWHFq0q+ELaiXmXV/x44Sfd7VMYPtqmPQgYWC1DmyTQmr7IDD1rjQ4FjVYHbcGG83pNTMnxqvJWwj0g4aPqmiqCb9A6s6e6E96fFvQ/xZ0bBDi6o5OCQmyD2P8KDZ7dNJiLSMM66V6pgSKVfz6WptIjMID62mPKkfJvUgHGq5ZL62Q9C1ETbDxVEKSy07+IF4R8dA15qMawIk6aeuv9qMxH7w7skOlk6c+RL48KUgELPXalGXMXiLVHA58npUD7jodbTDaApxGE2EtDYMkv5Ci9AZ6d90s1pxXsahWiTLSeBu4+uRxPINT/ppAwEIoirMrgRetEx3OLGdnvj6tc9gwbRDavrc2k13We/ymkn/QA7tti+RQIpE7+D5+qF0jBO6Q6S2w96vCXhD9NFSJMhF8zu+WscLW1NfzQ55cQ1tBmHz/txFPJHRCOvm2xqztZ3VBzvyO0fdAUkHahymYUnuij3XeMjVJJJY18ciIoS/awOdTg77gfmwWwcaxocLfXv8IDZv5uCyJfMwkmuQp0az1kypMW+2dxrBxYqhlE0zVokbcGZQwtkOKsasgOFxZm4VzDJqhZUg2Qe0uo3LM7z2gKKnYGgLuEvHPcUWTIqMULlg0kUKyuWXskhOnnUluSSVHNi1UotAPLNpuS1hwybv7N1ViEh71ScJlr8NDF07+Boq1RMXOGSlWytq4yNHQEB1HbmJ28422tk7rZpGD3QFdhde8svAVQl0Lix64qYx3kP12E1/AMQ5dFZP93gi9GcSuToJBCSFthlPCQv0lxg const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const pref = (label, o = {}) => {
  const rows = ["외모", "성격"].filter(k => o[k] && o[k].length)
    .map(k => `<div><span>${k}</span>${o[k].map(esc).join(", ")}</div>`).join("");
  return rows ? `<dt>${label}</dt><dd>${rows}</dd>` : "";
};
const list = a => (a && a.length) ? a.map(esc).join(", ") : '<span class="empty">-</span>';

function render(cards) {
  const html = cards.map(c => `
    <article class="card">
      <h2>${esc(c.제목)}</h2>
      <p class="one">${esc(c.성격)}</p>
      <div class="tags">
        <span class="tag strong">${esc(c.원하는만남)}</span>
        <span class="tag">${esc(c.MBTI)}</span>
        <span class="tag">종교 ${esc(c.종교)}</span>
        <span class="tag">흡연 ${esc(c.흡연)}</span>
        <span class="tag">음주 ${esc(c.음주)}</span>
      </div>
      <dl>
        <dt>사는 곳</dt><dd>${esc(c.사는곳)}</dd>
        <dt>직업</dt><dd>${esc(c.직업)}</dd>
        <dt>직장</dt><dd>${esc(c.직장위치)}</dd>
        <dt>취미</dt><dd>${esc(c.취미)}</dd>
      </dl>
      <div class="want">
        <h3>원하는 상대</h3>
        <dl>
          <dt>나이</dt><dd>${list(c.상대나이)}</dd>
          ${pref("좋아요", c.좋아요)}
          ${pref("안 맞아요", c.안맞아요)}
        </dl>
      </div>
    </article>`).join("");
  document.getElementById("app").innerHTML = `
    <header>
      <h1>소개팅 카드 · 남자 <span>${cards.length}명</span></h1>
      <p>사진 없이 정보만 보여 드려요.</p>
    </header>
    <section class="grid">${html}</section>
    <footer>마음에 드는 카드가 있으면 주선자에게 <b>카드 제목</b>(예: ${esc(cards[0]?.제목 || "93년생 · 178cm")})으로 알려 주세요.
      양쪽 모두 좋다고 하면 사진과 연락처를 전해 드려요.</footer>`;
  document.getElementById("lock").remove();
  document.getElementById("app").hidden = false;
}

async function open(pw, remember) {
  const cards = await decrypt(pw);
  if (remember) { try { sessionStorage.setItem("pw", pw); } catch (e) {} }
  render(cards);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "여는 중…"; err.textContent = "";
  try { await open(document.getElementById("pw").value, true); }
  catch (x) { err.textContent = "비밀번호가 맞지 않아요"; btn.disabled = false; btn.textContent = "열기"; }
});

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem("pw"); } catch (e) {}
  if (saved) { try { await open(saved, false); } catch (e) {} }
})();
</script>
</body>
</html>
