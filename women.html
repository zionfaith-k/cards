<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>소개팅 카드 · 여자</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70; --line: #e6e4df;
  --accent: #d9506b; --soft: #fdebef;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --card: #1f1f22; --text: #f1f1f3; --sub: #a1a1a8; --line: #2e2e33;
          --accent: #ff8fa5; --soft: #43202a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }

/* 잠금 화면 */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lockbox { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 28px 22px; text-align: center; }
.lockbox h1 { font-size: 19px; margin: 0 0 6px; }
.lockbox p { font-size: 14px; color: var(--sub); margin: 0 0 18px; }
.lockbox input { width: 100%; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg); color: var(--text); }
.lockbox input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.lockbox button { width: 100%; margin-top: 10px; font-size: 16px; font-weight: 600; padding: 12px;
  border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
.lockbox button:disabled { opacity: .6; cursor: default; }
.err { color: #d33; font-size: 13px; min-height: 20px; margin-top: 8px; }

/* 목록 */
header h1 { font-size: 22px; margin: 0 0 4px; }
header h1 span { color: var(--accent); }
header p { margin: 0 0 20px; color: var(--sub); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent);
  border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.card .one { margin: 0; font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--text); }
.tag.strong { background: var(--accent); color: #fff; font-weight: 600; }
dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 5px 10px; font-size: 14px; }
dt { color: var(--sub); }
dd { margin: 0; }
.want { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.want h3 { margin: 0; font-size: 13px; color: var(--sub); font-weight: 600; }
.want dl { grid-template-columns: 72px 1fr; }
.want dt { color: var(--text); font-weight: 600; }
.want dd span { color: var(--sub); margin-right: 6px; }
.empty { color: var(--sub); }
footer { margin-top: 28px; padding: 16px; border-radius: 12px; background: var(--card);
  border: 1px solid var(--line); font-size: 14px; color: var(--sub); }
footer b { color: var(--text); }
</style>
</head>
<body>
<div id="lock">
  <form class="lockbox" id="f">
    <h1>소개팅 카드 · 여자</h1>
    <p>비밀번호를 넣어 주세요</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="비밀번호" autofocus>
    <button id="go" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div class="wrap" id="app" hidden></div>

<script>
const PAYLOAD = {"salt": "XXWBIniaNDKhVyTsvWrnMg==", "iv": "eiosWWhZQm9RD+z8", "ct": "hZJ2rQMrQOM/kiRhn0h2tXNp3USAIkqMzsOil9FJAO9O2K/l/DYraWpces3QS47D7jXZ0qLGN+Pan4fAQXeizZHhyqg8y7UL7rayP3we8Zphx4Lyeo+3syvi991isTfX+fbLNAWAarRQyLOQUbZg2aP7ccJtt/q6Ptu/N0ezaPSBeJArogw9vkeg18/3y9ymw23NC3byzvdHgPpYJV0WYCpfYNuRg41BE+xeUaezvt8tPy29zploQM1OVUgX8Lhu0uVeMEZDDnTR7fOAUQUOjhHnX5J2ztNBplnWQ9wL7Bx19RbiAbCSn2q29AR8NnoQAZ+fcqhA0uKJ+pKXjQgDIS4AFxrQYittAYWcpjJ0NYp89jPwFZSASzacBqfYLKs6D5nWe5qcVRR/G1B+XcV/x6JPnogC69L56R80/bQbkK6w1GPWv1lpNIXxZC5gQ1rTjF7X5Uzj1XebqunLUOkppk3B7JcwDPBLHxBWItQdqp0SWKbDNlIDtuXLiOHXPil6ey6gQl86RHHNar+uDrJAfhBTDmZI93ZtvcJVyNrOjm1OmYNWnxKqL2sR9Z0LPwEfLrbsMpp5DXZsvWHYwScg3OzJ/HuQh3/056fU7tNA+xqlFrKxAx3suEUNW1aCwZD4S3M+Cqs5GVrkAuRqW1EdrAMSedQzC2BD1H63mcFSM8HKFtISDftd5GoMeAAdPWwRxNOtDBnEKw6xZRyjXOl9CU8prGo2A8sa7AO9FRobqyBrdCcdvOnZn6RnzJwYFXDETUcqw65kHON6/2MG06eLK14kz+M/i+5SCgBbPrNwLyaGAYkpT7n9cz8GjXcOI/8MkZ4jTHIXrNk1UtecTJfp7h8MUVVKGxhfxbn0l92So1HmQcCU7w8jW8lFBrqZ9h+P4nPqtTx4N8F1xMUM+sOeJ/rQ7ne+aaUfzheLlF18zRaC+yBQDLLd4jSd+az4C4Q7INnyAlDAPh+F5DIACNbp4m5E5e5WwaAPUgFE/4mK4ld8aOzb76xELCoZdGc79e54Fss3Cr8VuYhFrW/oAtKHkDbpbHKVdc5FOxQPHPnhnJw5pdZo8FMt2Dwyivwj9KWrva1Vm98lu36LzXlbkkEyLz/ltmfqEyBoWbdsvu1mR+PXRoY9Wo2b2YvmihBFEq4YjVX5XILTE4Ir0G0R3L9jCBcraTrUPpmbwRTTg2idQpXonq8eMOmLXYkVmYVehc2SVqrpYKwnkVW1LaAVUWL1n5KaNSfu5HOlF7LmjT0BPUkrdUG60WKnr9A45GUZ0BO6VIcSi+8n/Cj7aSz77C1Xoy2cRrZvj2JkERceiDFapryiQIcVPF4/tOXVQH+VjOgC3L0exKV33cG8N5P+Co/x3BobsNYqxrE/yKG9Rttu4dUvFdK8lAruGyjfRGC0qXLxCBIoCgPtItQI2P6rghPWQMZ4eR4xME4PT/3/7dEgUKRr/AMEEM9mkSAv5IbY+QFt9pAZMm5BVoTU7+U3iSjGFTO1NUyAMeVov2gUzwxJCrqo8cd8xdwc4vf+5poMmiGTp3wP7t5CiLi3an58ojx1TzQSF7jVB2pdEwDlfMqWUuWxoUkVCPGYGVDlUjsWGUiEML29a1p50GQgmENqNamsmiExWGxFc39vJDFuqB20NxQiuNIVy2KHq39o/AFZYYoNZk+gycah4pPxrqxmGj8pNV0sW18PXTXhdRI0/GmGpnrDIb23G/+pgjfCkXZm4W6E2o1OEB+cB6xDBL2eo+BF29x/cSIdSFIuzOVOXEygfhLpQhYxctVoIsee7h+2BMSmiw0kxyID5h18LLqAMrl7dgjR7PhGHFYZen7oL30YncOrHdMJVJP8U2vdH70NuERtrPG1hUY8nXKLf/cqC5TRbPXOQcgp/pYluPnfmqUqESw/AMRJJ+5w9KsjbFfIuWS/eMh3TLNiRI4C+TuoBVFLR+llyAmqR6QgJeDHp9/LEA57Hv6LI0RZGmXswMPl1wME49AzSMxbjaSCYNNK+OJQRpW4/JCFBZnN2twKseSTpVcmqrQ58smQsK8ecMpV6pZI5S+PmnxVK8aPFEsCP1ZW+77kh8bSbQx1qZOyb3Knxvc5c1Vkm/CluyUAw1Y4cSfzzK036mTT/iKS+Ro3axbEnpb63aP0cuSgULwD0idza72betHvdJKNqT98r0IcfcniSZ0yaZbVngfC7pfKPVW3xhBAY98BPc+sUWTmcY1xYNMGrWX/oad5g/ihLT4JJLBTsZfXkDV0EEUDN+ZGcue7Ddr81CzCunJt29on8yExUkGCeE9VDEGNyYilmpjPqojfKtcXV4OBPQ==", "iter": 310000};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const pref = (label, o = {}) => {
  const rows = ["외모", "성격"].filter(k => o[k] && o[k].length)
    .map(k => `<div><span>${k}</span>${o[k].map(esc).join(", ")}</div>`).join("");
  return rows ? `<dt>${label}</dt><dd>${rows}</dd>` : "";
};
const list = a => (a && a.length) ? a.map(esc).join(", ") : '<span class="empty">-</span>';

function render(cards) {
  const html = cards.map(c => `
    <article class="card">
      <h2>${esc(c.제목)}</h2>
      <p class="one">${esc(c.성격)}</p>
      <div class="tags">
        <span class="tag strong">${esc(c.원하는만남)}</span>
        <span class="tag">${esc(c.MBTI)}</span>
        <span class="tag">종교 ${esc(c.종교)}</span>
        <span class="tag">흡연 ${esc(c.흡연)}</span>
        <span class="tag">음주 ${esc(c.음주)}</span>
      </div>
      <dl>
        <dt>사는 곳</dt><dd>${esc(c.사는곳)}</dd>
        <dt>직업</dt><dd>${esc(c.직업)}</dd>
        <dt>직장</dt><dd>${esc(c.직장위치)}</dd>
        <dt>취미</dt><dd>${esc(c.취미)}</dd>
      </dl>
      <div class="want">
        <h3>원하는 상대</h3>
        <dl>
          <dt>나이</dt><dd>${list(c.상대나이)}</dd>
          ${pref("좋아요", c.좋아요)}
          ${pref("안 맞아요", c.안맞아요)}
        </dl>
      </div>
    </article>`).join("");
  document.getElementById("app").innerHTML = `
    <header>
      <h1>소개팅 카드 · 여자 <span>${cards.length}명</span></h1>
      <p>사진 없이 정보만 보여 드려요.</p>
    </header>
    <section class="grid">${html}</section>
    <footer>마음에 드는 카드가 있으면 주선자에게 <b>카드 제목</b>(예: ${esc(cards[0]?.제목 || "93년생 · 178cm")})으로 알려 주세요.
      양쪽 모두 좋다고 하면 사진과 연락처를 전해 드려요.</footer>`;
  document.getElementById("lock").remove();
  document.getElementById("app").hidden = false;
}

async function open(pw, remember) {
  const cards = await decrypt(pw);
  if (remember) { try { sessionStorage.setItem("pw", pw); } catch (e) {} }
  render(cards);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "여는 중…"; err.textContent = "";
  try { await open(document.getElementById("pw").value, true); }
  catch (x) { err.textContent = "비밀번호가 맞지 않아요"; btn.disabled = false; btn.textContent = "열기"; }
});

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem("pw"); } catch (e) {}
  if (saved) { try { await open(saved, false); } catch (e) {} }
})();
</script>
</body>
</html>
